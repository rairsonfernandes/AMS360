<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7ad0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2b7fc4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd93d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f9b84a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Fundo circular -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)" stroke="#7ad0ff" stroke-width="2"/>
  <!-- Símbolo do furacão -->
  <text x="50" y="58" font-family="Arial" font-size="45" font-weight="bold" fill="white" text-anchor="middle">🌀</text>
  <!-- Sol no canto superior direito -->
  <circle cx="72" cy="22" r="10" fill="url(#grad2)"/>
  <circle cx="72" cy="22" r="7" fill="#ffd93d"/>
  <!-- Raio do sol -->
  <line x1="72" y1="10" x2="72" y2="6" stroke="#ffd93d" stroke-width="2"/>
  <line x1="72" y1="34" x2="72" y2="38" stroke="#ffd93d" stroke-width="2"/>
  <line x1="60" y1="22" x2="56" y2="22" stroke="#ffd93d" stroke-width="2"/>
  <line x1="84" y1="22" x2="88" y2="22" stroke="#ffd93d" stroke-width="2"/>
  <line x1="63" y1="13" x2="60" y2="10" stroke="#ffd93d" stroke-width="2"/>
  <line x1="81" y1="31" x2="84" y2="34" stroke="#ffd93d" stroke-width="2"/>
  <line x1="63" y1="31" x2="60" y2="34" stroke="#ffd93d" stroke-width="2"/>
  <line x1="81" y1="13" x2="84" y2="10" stroke="#ffd93d" stroke-width="2"/>
  <!-- Texto AMS -->
  <text x="50" y="88" font-family="Arial" font-size="10" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="2">AMS</text>
</svg>
